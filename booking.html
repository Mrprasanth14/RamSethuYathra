<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Your Booking | RamSethuYatra</title>

    <link rel="stylesheet" href="booking.css">


</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="booking-header">

    <a href="index.html">
        ← RamSethuYatra
    </a>

    <h1>
        Complete Your Booking
    </h1>

</header>



<!-- =========================================
     MAIN BOOKING
========================================= -->

<main class="booking-container">


    <!-- BOOKING SUMMARY -->

    <section class="booking-summary">

        <h2>
            Booking Summary
        </h2>


        <div class="summary-row">

            <span>
                Package
            </span>

            <strong id="packageName">
                -
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Persons
            </span>

            <strong id="personCount">
                -
            </strong>

        </div>


        <div class="summary-total">

            <span>
                Total Package
            </span>

            <strong id="totalAmount">
                ₹0
            </strong>

        </div>

    </section>



    <!-- CUSTOMER DETAILS -->

    <section class="booking-form">

        <h2>
            Customer Details
        </h2>


        <form id="bookingForm">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="customerMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label>
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travelDate"
                    required
                >

            </div>



            <!-- TIME -->

            <div class="form-group">

                <label>
                    Pickup Time
                </label>

                <input
                    type="time"
                    id="pickupTime"
                    required
                >

            </div>



            <!-- PICKUP -->

            <div class="form-group">

                <label>
                    Pickup Location
                </label>

                <input
                    type="text"
                    id="pickupLocation"
                    placeholder="Hotel / Railway Station / Bus Stand"
                    required
                >

            </div>



            <!-- SPECIAL REQUEST -->

            <div class="form-group">

                <label>
                    Special Request
                </label>

                <textarea
                    id="specialRequest"
                    placeholder="Any special requirements?"
                ></textarea>

            </div>



            <!-- CONFIRM -->

            <button
                type="submit"
                class="confirm-btn"
            >
                Confirm Booking
            </button>


        </form>

    </section>


</main>



<!-- =========================================
     CUSTOM POPUP
========================================= -->

<div
    id="customModal"
    class="custom-modal"
>


    <div class="custom-modal-box">


        <button
            class="popup-close"
            id="popupClose"
            type="button"
        >
            ×
        </button>


        <!-- ICON -->

        <div
            id="popupIcon"
            class="popup-icon success"
        >
            ✓
        </div>


        <!-- TITLE -->

        <h2 id="popupTitle">
            Booking Confirmed!
        </h2>


        <!-- MESSAGE -->

        <p
            id="popupMessage"
            class="popup-message"
        >
            Your RamSethuYatra trip has been successfully booked.
        </p>


        <!-- BOOKING ID -->

        <div
            id="bookingIdContainer"
            class="booking-id-box"
        >

            <span>
                Booking ID
            </span>

            <strong id="popupBookingId">
                -
            </strong>

        </div>


        <!-- BUTTON -->

        <button
            id="popupButton"
            class="popup-button"
            type="button"
        >
            Continue
        </button>


    </div>

</div>



<!-- =========================================
     FIREBASE BOOKING
========================================= -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";



/* =========================================
   URL PARAMETERS
========================================= */

const params =
    new URLSearchParams(window.location.search);


const packageType =
    params.get("package");


const persons =
    params.get("persons");


const price =
    params.get("price");



/* =========================================
   PACKAGE NAMES
========================================= */

const packageNames = {

    normal: "Normal Package",

    medium: "Medium Package",

    premium: "Premium Package"

};



/* =========================================
   DISPLAY PACKAGE INFORMATION
========================================= */

document.getElementById("packageName")
    .textContent =
    packageNames[packageType] || "Package";


document.getElementById("personCount")
    .textContent =
    persons
        ? persons + " Persons"
        : "-";


document.getElementById("totalAmount")
    .textContent =
    price
        ? "₹" + Number(price).toLocaleString("en-IN")
        : "₹0";



/* =========================================
   CUSTOM POPUP ELEMENTS
========================================= */

const customModal =
    document.getElementById("customModal");


const popupIcon =
    document.getElementById("popupIcon");


const popupTitle =
    document.getElementById("popupTitle");


const popupMessage =
    document.getElementById("popupMessage");


const popupBookingId =
    document.getElementById("popupBookingId");


const bookingIdContainer =
    document.getElementById("bookingIdContainer");


const popupButton =
    document.getElementById("popupButton");


const popupClose =
    document.getElementById("popupClose");



/* =========================================
   SHOW CUSTOM POPUP
========================================= */

function showPopup(
    type,
    title,
    message,
    bookingId = null,
    buttonText = "OK",
    callback = null
) {

    /* Remove old icon classes */

    popupIcon.classList.remove(
        "success",
        "error",
        "warning"
    );


    /* Add current icon type */

    popupIcon.classList.add(type);


    /* Set icon */

    if (type === "success") {

        popupIcon.textContent = "✓";

    }

    else if (type === "error") {

        popupIcon.textContent = "!";

    }

    else {

        popupIcon.textContent = "!";

    }


    /* Set text */

    popupTitle.textContent =
        title;


    popupMessage.textContent =
        message;


    /* Booking ID */

    if (bookingId) {

        bookingIdContainer.style.display =
            "block";

        popupBookingId.textContent =
            bookingId;

    }

    else {

        bookingIdContainer.style.display =
            "none";

        popupBookingId.textContent =
            "";

    }


    /* Button */

    popupButton.textContent =
        buttonText;


    /* Save callback */

    popupButton.onclick = function() {

        closePopup();

        if (callback) {
            callback();
        }

    };


    /* Show */

    customModal.classList.add("show");

}



/* =========================================
   CLOSE POPUP
========================================= */

function closePopup() {

    customModal.classList.remove("show");

}


popupClose.addEventListener(
    "click",
    closePopup
);



/* =========================================
   CLOSE WHEN CLICKING OUTSIDE
========================================= */

customModal.addEventListener(
    "click",
    function(e) {

        if (e.target === customModal) {

            closePopup();

        }

    }
);



/* =========================================
   BOOKING FORM
========================================= */

document.getElementById("bookingForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            /* CUSTOMER NAME */

            const name =
                document
                    .getElementById("customerName")
                    .value
                    .trim();


            /* MOBILE */

            const mobile =
                document
                    .getElementById("customerMobile")
                    .value
                    .trim();


            /* DATE */

            const date =
                document
                    .getElementById("travelDate")
                    .value;


            /* TIME */

            const time =
                document
                    .getElementById("pickupTime")
                    .value;


            /* PICKUP */

            const pickup =
                document
                    .getElementById("pickupLocation")
                    .value
                    .trim();


            /* SPECIAL REQUEST */

            const request =
                document
                    .getElementById("specialRequest")
                    .value
                    .trim();



            /* =================================
               MOBILE VALIDATION
            ================================= */

            if (!/^[0-9]{10}$/.test(mobile)) {

                showPopup(

                    "warning",

                    "Check Your Mobile Number",

                    "Please enter a valid 10-digit mobile number.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               PACKAGE VALIDATION
            ================================= */

            if (
                !packageType ||
                !persons ||
                !price
            ) {

                showPopup(

                    "error",

                    "Booking Information Missing",

                    "We couldn't find the selected package details. Please return to the package page and try again.",

                    null,

                    "Go Back",

                    function() {

                        window.location.href =
                            "totalpackage.html";

                    }

                );

                return;

            }



            /* =================================
               DISABLE BUTTON
            ================================= */

            const button =
                document.querySelector(
                    ".confirm-btn"
                );


            button.disabled = true;


            button.textContent =
                "Saving Booking...";



            /* =================================
               SAVE TO FIREBASE
            ================================= */

            try {

                const bookingData = {

                    bookingType: "package",

                    package: packageType,

                    packageName:
                        packageNames[packageType],

                    persons:
                        Number(persons),

                    totalPrice:
                        Number(price),

                    customerName:
                        name,

                    customerMobile:
                        mobile,

                    travelDate:
                        date,

                    pickupTime:
                        time,

                    pickupLocation:
                        pickup,

                    specialRequest:
                        request,

                    status:
                        "pending",

                    createdAt:
                        serverTimestamp()

                };



                const docRef =
                    await addDoc(

                        collection(
                            db,
                            "packageBookings"
                        ),

                        bookingData

                    );



                console.log(
                    "Booking saved:",
                    docRef.id
                );



                /* =================================
                   SUCCESS POPUP
                ================================= */

                showPopup(

                    "success",

                    "Booking Confirmed! 🎉",

                    "Your RamSethuYatra trip has been successfully booked. Please save your Booking ID for future reference.",

                    docRef.id,

                    "View Booking",

                    function() {

                        window.location.href =
                            "booking-success.html?id=" +
                            encodeURIComponent(
                                docRef.id
                            );

                    }

                );



            } catch (error) {

                console.error(
                    "Booking error:",
                    error
                );



                /* =================================
                   ERROR POPUP
                ================================= */

                showPopup(

                    "error",

                    "Booking Failed",

                    "We couldn't save your booking right now. Please check your internet connection and try again.",

                    null,

                    "Try Again"

                );


                button.disabled =
                    false;


                button.textContent =
                    "Confirm Booking";

            }

        }
    );

</script>


</body>

</html>
