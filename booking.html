<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Your Booking | RamSethuYatra</title>

    <link rel="stylesheet" href="booking.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="booking-header">

    <a href="index.html">
        ← RamSethuYatra
    </a>

    <h1>
        Complete Your Booking
    </h1>

</header>



<!-- =========================================
     MAIN BOOKING
========================================= -->

<main class="booking-container">


    <!-- BOOKING SUMMARY -->

    <section class="booking-summary">

        <h2>
            Booking Summary
        </h2>


        <div class="summary-row">

            <span>
                Package
            </span>

            <strong id="packageName">
                -
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Persons
            </span>

            <strong id="personCount">
                -
            </strong>

        </div>


        <div class="summary-total">

            <span>
                Total Package
            </span>

            <strong id="totalAmount">
                ₹0
            </strong>

        </div>

    </section>



    <!-- CUSTOMER DETAILS -->

    <section class="booking-form">

        <h2>
            Customer Details
        </h2>


        <form id="bookingForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="customerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label for="customerMobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="customerMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label for="travelDate">
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travelDate"
                    required
                >

            </div>



            <!-- TIME -->

            <div class="form-group">

                <label for="pickupTime">
                    Pickup Time
                </label>

                <input
                    type="time"
                    id="pickupTime"
                    required
                >

            </div>



            <!-- PICKUP -->

            <div class="form-group">

                <label for="pickupLocation">
                    Pickup Location
                </label>

                <input
                    type="text"
                    id="pickupLocation"
                    placeholder="Hotel / Railway Station / Bus Stand"
                    required
                >

            </div>



            <!-- SPECIAL REQUEST -->

            <div class="form-group">

                <label for="specialRequest">
                    Special Request
                </label>

                <textarea
                    id="specialRequest"
                    placeholder="Any special requirements?"
                ></textarea>

            </div>



            <!-- CONFIRM -->

            <button
                type="submit"
                class="confirm-btn"
            >
                Confirm Booking
            </button>


        </form>

    </section>


</main>



<!-- =========================================
     CUSTOM POPUP
========================================= -->

<div
    id="customModal"
    class="custom-modal"
>

    <div class="custom-modal-box">


        <button
            class="popup-close"
            id="popupClose"
            type="button"
        >
            ×
        </button>


        <div
            id="popupIcon"
            class="popup-icon success"
        >
            ✓
        </div>


        <h2 id="popupTitle">
            Booking Confirmed!
        </h2>


        <p
            id="popupMessage"
            class="popup-message"
        >
            Your RamSethuYatra trip has been successfully booked.
        </p>


        <div
            id="bookingIdContainer"
            class="booking-id-box"
        >

            <span>
                Booking ID
            </span>

            <strong id="popupBookingId">
                -
            </strong>

        </div>


        <button
            id="popupButton"
            class="popup-button"
            type="button"
        >
            Continue
        </button>


    </div>

</div>



<!-- =========================================
     FIREBASE BOOKING
========================================= -->

<script type="module">

import { db, auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";



/* =========================================
   URL PARAMETERS
========================================= */

const params =
    new URLSearchParams(window.location.search);

const packageType =
    params.get("package");

const persons =
    params.get("persons");


/*
IMPORTANT:

We intentionally DO NOT use:

params.get("price")

The price is calculated below from
our trusted package price table.
*/



/* =========================================
   PACKAGE NAMES
========================================= */

const packageNames = {

    normal: "Normal Package",

    medium: "Medium Package",

    premium: "Premium Package"

};



/* =========================================
   PACKAGE PRICES
========================================= */

const packagePrices = {

    normal: {

        2: 4000,
        3: 4800,
        4: 5900,
        5: 7000,
        6: 8200,
        7: 9300,
        8: 10500,
        9: 11600,
        10: 12700

    },

    medium: {

        2: 5500,
        3: 6500,
        4: 8000,
        5: 9500,
        6: 10800,
        7: 12000,
        8: 13500,
        9: 14800,
        10: 16000

    },

    premium: {

        2: 7500,
        3: 9000,
        4: 11000,
        5: 13000,
        6: 14800,
        7: 16500,
        8: 18200,
        9: 20000,
        10: 22000

    }

};



/* =========================================
   CALCULATE TRUSTED PRICE
========================================= */

function getPackagePrice(packageName, personCount) {

    if (!packagePrices[packageName]) {

        return null;

    }

    if (!packagePrices[packageName][personCount]) {

        return null;

    }

    return packagePrices[packageName][personCount];

}



/* =========================================
   VALIDATE PACKAGE INFORMATION
========================================= */

const personNumber =
    Number(persons);

const totalPrice =
    getPackagePrice(
        packageType,
        personNumber
    );


/*
If somebody manually changes the URL,
for example:

?package=premium&persons=5&price=1

the price parameter is completely ignored.

The website calculates:

premium + 5 persons = ₹13,000
*/



/* =========================================
   DISPLAY PACKAGE INFORMATION
========================================= */

if (
    packageNames[packageType] &&
    totalPrice !== null
) {

    document.getElementById("packageName")
        .textContent =
        packageNames[packageType];


    document.getElementById("personCount")
        .textContent =
        personNumber + " Persons";


    document.getElementById("totalAmount")
        .textContent =
        "₹" +
        totalPrice.toLocaleString("en-IN");

} else {

    document.getElementById("packageName")
        .textContent =
        "Invalid Package";


    document.getElementById("personCount")
        .textContent =
        "-";


    document.getElementById("totalAmount")
        .textContent =
        "₹0";

}



/* =========================================
   POPUP ELEMENTS
========================================= */

const customModal =
    document.getElementById("customModal");

const popupIcon =
    document.getElementById("popupIcon");

const popupTitle =
    document.getElementById("popupTitle");

const popupMessage =
    document.getElementById("popupMessage");

const popupBookingId =
    document.getElementById("popupBookingId");

const bookingIdContainer =
    document.getElementById("bookingIdContainer");

const popupButton =
    document.getElementById("popupButton");

const popupClose =
    document.getElementById("popupClose");



/* =========================================
   SHOW POPUP
========================================= */

function showPopup(
    type,
    title,
    message,
    bookingId = null,
    buttonText = "OK",
    callback = null
) {

    popupIcon.classList.remove(
        "success",
        "error",
        "warning"
    );

    popupIcon.classList.add(type);


    if (type === "success") {

        popupIcon.textContent = "✓";

    } else {

        popupIcon.textContent = "!";

    }


    popupTitle.textContent =
        title;

    popupMessage.textContent =
        message;


    if (bookingId) {

        bookingIdContainer.style.display =
            "block";

        popupBookingId.textContent =
            bookingId;

    } else {

        bookingIdContainer.style.display =
            "none";

        popupBookingId.textContent =
            "";

    }


    popupButton.textContent =
        buttonText;


    popupButton.onclick =
        function() {

            closePopup();

            if (callback) {

                callback();

            }

        };


    customModal.classList.add("show");

}



/* =========================================
   CLOSE POPUP
========================================= */

function closePopup() {

    customModal.classList.remove("show");

}


popupClose.addEventListener(
    "click",
    closePopup
);


customModal.addEventListener(
    "click",
    function(e) {

        if (e.target === customModal) {

            closePopup();

        }

    }
);



/* =========================================
   CUSTOMER LOGIN
========================================= */

let currentUser = null;


onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            const currentPage =
                window.location.pathname.split("/").pop()
                + window.location.search;


            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(currentPage);

            return;

        }


        currentUser =
            user;


        console.log(
            "Customer logged in:",
            user.uid
        );


        /*
        Automatically fill customer name
        from Firebase Authentication.
        */

        const nameInput =
            document.getElementById(
                "customerName"
            );


        if (
            user.displayName &&
            !nameInput.value
        ) {

            nameInput.value =
                user.displayName;

        }

    }
);



/* =========================================
   BOOKING FORM
========================================= */

document.getElementById("bookingForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            /* =================================
               LOGIN CHECK
            ================================= */

            if (!currentUser) {

                showPopup(

                    "warning",

                    "Login Required",

                    "Please login to your RamSethuYatra account before making a booking.",

                    null,

                    "Login",

                    function() {

                        window.location.href =
                            "login.html?redirect=" +
                            encodeURIComponent(
                                window.location.pathname +
                                window.location.search
                            );

                    }

                );

                return;

            }



            /* =================================
               PACKAGE VALIDATION
            ================================= */

            if (
                !packageNames[packageType] ||
                totalPrice === null ||
                !Number.isInteger(personNumber) ||
                personNumber < 2 ||
                personNumber > 10
            ) {

                showPopup(

                    "error",

                    "Invalid Package",

                    "The selected package information is invalid. Please return to the package page and select your package again.",

                    null,

                    "Go Back",

                    function() {

                        window.location.href =
                            "totalpackage.html";

                    }

                );

                return;

            }



            /* =================================
               CUSTOMER NAME
            ================================= */

            const name =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();



            /* =================================
               MOBILE
            ================================= */

            const mobile =
                document
                    .getElementById(
                        "customerMobile"
                    )
                    .value
                    .trim();



            /* =================================
               DATE
            ================================= */

            const date =
                document
                    .getElementById(
                        "travelDate"
                    )
                    .value;



            /* =================================
               TIME
            ================================= */

            const time =
                document
                    .getElementById(
                        "pickupTime"
                    )
                    .value;



            /* =================================
               PICKUP
            ================================= */

            const pickup =
                document
                    .getElementById(
                        "pickupLocation"
                    )
                    .value
                    .trim();



            /* =================================
               SPECIAL REQUEST
            ================================= */

            const request =
                document
                    .getElementById(
                        "specialRequest"
                    )
                    .value
                    .trim();



            /* =================================
               NAME VALIDATION
            ================================= */

            if (name.length < 2) {

                showPopup(

                    "warning",

                    "Invalid Name",

                    "Please enter your full name.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               MOBILE VALIDATION
            ================================= */

            if (!/^[6-9][0-9]{9}$/.test(mobile)) {

                showPopup(

                    "warning",

                    "Check Your Mobile Number",

                    "Please enter a valid 10-digit Indian mobile number.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               DATE VALIDATION
            ================================= */

            if (!date) {

                showPopup(

                    "warning",

                    "Travel Date Required",

                    "Please select your travel date.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               TIME VALIDATION
            ================================= */

            if (!time) {

                showPopup(

                    "warning",

                    "Pickup Time Required",

                    "Please select your pickup time.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               PICKUP VALIDATION
            ================================= */

            if (pickup.length < 2) {

                showPopup(

                    "warning",

                    "Pickup Location Required",

                    "Please enter your pickup location.",

                    null,

                    "Try Again"

                );

                return;

            }



            /* =================================
               DISABLE BUTTON
            ================================= */

            const button =
                document.querySelector(
                    ".confirm-btn"
                );


            button.disabled =
                true;


            button.textContent =
                "Saving Booking...";



            /* =================================
               FIREBASE BOOKING DATA
            ================================= */

            try {

                const bookingData = {

                    userId:
                        currentUser.uid,

                    customerEmail:
                        currentUser.email || "",

                    bookingType:
                        "package",

                    package:
                        packageType,

                    packageName:
                        packageNames[packageType],

                    persons:
                        personNumber,

                    totalPrice:
                        totalPrice,

                    customerName:
                        name,

                    customerMobile:
                        mobile,

                    travelDate:
                        date,

                    pickupTime:
                        time,

                    pickupLocation:
                        pickup,

                    specialRequest:
                        request,

                    status:
                        "pending",

                    createdAt:
                        serverTimestamp()

                };


                const docRef =
                    await addDoc(

                        collection(
                            db,
                            "packageBookings"
                        ),

                        bookingData

                    );


                console.log(
                    "Booking saved:",
                    docRef.id
                );


                /* =================================
                   SUCCESS
                ================================= */

                showPopup(

                    "success",

                    "Booking Confirmed! 🎉",

                    "Your RamSethuYatra trip has been successfully booked. Please save your Booking ID for future reference.",

                    docRef.id,

                    "View Booking",

                    function() {

                        window.location.href =
                            "booking-success.html?id=" +
                            encodeURIComponent(
                                docRef.id
                            );

                    }

                );


            } catch (error) {

                console.error(
                    "Booking error:",
                    error
                );


                showPopup(

                    "error",

                    "Booking Failed",

                    "We couldn't save your booking right now. Please check your internet connection and try again.",

                    null,

                    "Try Again"

                );


                button.disabled =
                    false;


                button.textContent =
                    "Confirm Booking";

            }

        }
    );

</script>


</body>

</html>
