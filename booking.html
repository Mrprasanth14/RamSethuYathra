<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Your Booking | RamSethuYatra</title>

    <link rel="stylesheet" href="booking.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="booking-header">

    <a href="index.html">
        ← RamSethuYatra
    </a>

    <h1>
        Complete Your Booking
    </h1>

</header>



<!-- =========================================
     MAIN BOOKING
========================================= -->

<main class="booking-container">


    <!-- BOOKING SUMMARY -->

    <section class="booking-summary">

        <h2>
            Booking Summary
        </h2>


        <div class="summary-row">

            <span>
                Package
            </span>

            <strong id="packageName">
                -
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Persons
            </span>

            <strong id="personCount">
                -
            </strong>

        </div>
        <div class="summary-row">
    <span>Check-in</span>
    <strong id="summaryCheckIn">-</strong>
</div>

<div class="summary-row">
    <span>Check-out</span>
    <strong id="summaryCheckOut">-</strong>
</div>

<div class="summary-row">
    <span>Stay Duration</span>
    <strong id="summaryNights">-</strong>
</div>


        <div class="summary-total">

            <span>
                Total Package
            </span>

            <strong id="totalAmount">
                ₹0
            </strong>

        </div>

    </section>



    <!-- CUSTOMER DETAILS -->

    <section class="booking-form">

        <h2>
            Customer Details
        </h2>


        <form id="bookingForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="customerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label for="customerMobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="customerMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label for="travelDate">
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travelDate"
                    required
                >

            </div>



            <!-- TIME -->

            <div class="form-group">

                <label for="pickupTime">
                    Pickup Time
                </label>

                <input
                    type="time"
                    id="pickupTime"
                    required
                >

            </div>



            <!-- PICKUP -->

            <div class="form-group">

                <label for="pickupLocation">
                    Pickup Location
                </label>

                <input
                    type="text"
                    id="pickupLocation"
                    placeholder="Hotel / Railway Station / Bus Stand"
                    required
                >

            </div>



            <!-- SPECIAL REQUEST -->

            <div class="form-group">

                <label for="specialRequest">
                    Special Request
                </label>

                <textarea
                    id="specialRequest"
                    placeholder="Any special requirements?"
                ></textarea>

            </div>



            <!-- CONFIRM -->

            <button
                type="submit"
                class="confirm-btn"
            >
                Confirm Booking
            </button>


        </form>

    </section>


</main>



<!-- =========================================
     CUSTOM POPUP
========================================= -->

<div
    id="customModal"
    class="custom-modal"
>

    <div class="custom-modal-box">


        <button
            class="popup-close"
            id="popupClose"
            type="button"
        >
            ×
        </button>


        <div
            id="popupIcon"
            class="popup-icon success"
        >
            ✓
        </div>


        <h2 id="popupTitle">
            Booking Confirmed!
        </h2>


        <p
            id="popupMessage"
            class="popup-message"
        >
            Your RamSethuYatra trip has been successfully booked.
        </p>


        <div
            id="bookingIdContainer"
            class="booking-id-box"
        >

            <span>
                Booking ID
            </span>

            <strong id="popupBookingId">
                -
            </strong>

        </div>


        <button
            id="popupButton"
            class="popup-button"
            type="button"
        >
            Continue
        </button>


    </div>

</div>
</body>


<!-- =========================================
     FIREBASE BOOKING
========================================= -->

<script type="module">

import { db, auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


// ==========================================
// 1. URL PARAMETERS
// ==========================================

const params = new URLSearchParams(window.location.search);

const packageType = params.get("package");

const personNumber = Number(params.get("persons"));

const checkInDate =
    params.get("checkIn") || params.get("checkin");

const checkOutDate =
    params.get("checkOut") || params.get("checkout");


// ==========================================
// 2. DATE VALIDATION
// ==========================================

function isValidDate(value) {

    if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
    }

    const [year, month, day] = value.split("-").map(Number);

    const date = new Date(Date.UTC(year, month - 1, day));

    return date.getUTCFullYear() === year
        && date.getUTCMonth() === month - 1
        && date.getUTCDate() === day;
}


function getNightsFromDates(checkin, checkout) {

    if (
        !isValidDate(checkin) ||
        !isValidDate(checkout)
    ) {
        return 0;
    }

    const [inYear, inMonth, inDay] =
        checkin.split("-").map(Number);

    const [outYear, outMonth, outDay] =
        checkout.split("-").map(Number);

    const inDate =
        Date.UTC(inYear, inMonth - 1, inDay);

    const outDate =
        Date.UTC(outYear, outMonth - 1, outDay);

    const difference =
        outDate - inDate;

    const dayMilliseconds =
        24 * 60 * 60 * 1000;

    if (
        difference <= 0 ||
        difference % dayMilliseconds !== 0
    ) {
        return 0;
    }

    return difference / dayMilliseconds;
}


const nights =
    getNightsFromDates(checkInDate, checkOutDate);


// ==========================================
// 3. PACKAGE NAMES
// ==========================================

const packageNames = {

    normal: "Normal Package",

    medium: "Medium Package",

    premium: "Premium Package"

};


// ==========================================
// 4. PACKAGE BASE PRICES
// ==========================================

const packagePrices = {

    normal: {
        2: 7500,
        3: 8500,
        4: 9500,
        5: 12500,
        6: 13500
    },

    medium: {
        2: 9000,
        3: 10000,
        4: 11000,
        5: 14000,
        6: 15000,
        7: 16500,
        8: 21000,
        9: 23000,
        10: 24000
    },

    premium: {
        2: 15000,
        3: 17000,
        4: 19500,
        5: 23500,
        6: 25000
    }

};


// ==========================================
// 5. ADDITIONAL NIGHT CHARGES
// ==========================================

const normalExtraNightCharges = {

    2: 2000,
    3: 2500,
    4: 2500,
    5: 3800,
    6: 4000

};


const mediumRoomCharges = {

    2: 2000,
    3: 2800,
    4: 3000,
    5: 4500,
    6: 5000,
    7: 5500,
    8: 6000,
    9: 7500,
    10: 8000

};


const premiumExtraNightCharges = {

    2: 4000,
    3: 4000,
    4: 7000,
    5: 9000,
    6: 10000

};


// ==========================================
// 6. CALCULATE PACKAGE PRICE
// ==========================================

function getPackagePrice(packageName, persons, stayNights) {

    if (
        !Number.isInteger(persons) ||
        !Number.isInteger(stayNights) ||
        stayNights < 1 ||
        stayNights > 30
    ) {
        return null;
    }

    const basePrice =
        packagePrices[packageName]?.[persons];

    if (basePrice === undefined) {
        return null;
    }


    // NORMAL PACKAGE
    // Base price + additional night charges

    if (packageName === "normal") {

        const extraCharge =
            normalExtraNightCharges[persons];

        if (extraCharge === undefined) {
            return null;
        }

        return basePrice +
            (extraCharge * (stayNights - 1));

    }


    // MEDIUM PACKAGE
    // Base price + room charge per night

    if (packageName === "medium") {

        const roomCharge =
            mediumRoomCharges[persons];

        if (roomCharge === undefined) {
            return null;
        }

        return basePrice +
            (roomCharge * stayNights);

    }


    // PREMIUM PACKAGE
    // Base price + additional night charges

    if (packageName === "premium") {

        const extraCharge =
            premiumExtraNightCharges[persons];

        if (extraCharge === undefined) {
            return null;
        }

        return basePrice +
            (extraCharge * (stayNights - 1));

    }

    return null;
}


// ==========================================
// 7. GET TOTAL PRICE
// ==========================================

const totalPrice = getPackagePrice(
    packageType,
    personNumber,
    nights
);


console.log("PACKAGE PRICE:", {
    package: packageType,
    persons: personNumber,
    checkInDate,
    checkOutDate,
    nights,
    totalPrice
});


// ==========================================
// 8. DISPLAY PACKAGE INFORMATION
// ==========================================

function formatDate(dateString) {

    if (!isValidDate(dateString)) {
        return "-";
    }

    const [year, month, day] =
        dateString.split("-");

    return `${day}-${month}-${year}`;
}


const packageNameElement =
    document.getElementById("packageName");

const personCountElement =
    document.getElementById("personCount");

const totalAmountElement =
    document.getElementById("totalAmount");

const summaryCheckIn =
    document.getElementById("summaryCheckIn");

const summaryCheckOut =
    document.getElementById("summaryCheckOut");

const summaryNights =
    document.getElementById("summaryNights");


if (
    packageNames[packageType] &&
    totalPrice !== null
) {

    packageNameElement.textContent =
        packageNames[packageType];

    personCountElement.textContent =
        `${personNumber} Persons`;

    totalAmountElement.textContent =
        "₹" + totalPrice.toLocaleString("en-IN");

} else {

    packageNameElement.textContent =
        "Invalid Package";

    personCountElement.textContent = "-";

    totalAmountElement.textContent = "₹0";

}


summaryCheckIn.textContent =
    formatDate(checkInDate);

summaryCheckOut.textContent =
    formatDate(checkOutDate);

summaryNights.textContent =
    nights > 0
        ? `${nights} ${nights === 1 ? "Night" : "Nights"}`
        : "-";


// ==========================================
// 9. AUTO-FILL TRAVEL DATE
// ==========================================

const travelDateInput =
    document.getElementById("travelDate");

if (travelDateInput && isValidDate(checkInDate)) {

    travelDateInput.value = checkInDate;

}


// ==========================================
// 10. POPUP ELEMENTS
// ==========================================

const customModal =
    document.getElementById("customModal");

const popupIcon =
    document.getElementById("popupIcon");

const popupTitle =
    document.getElementById("popupTitle");

const popupMessage =
    document.getElementById("popupMessage");

const popupBookingId =
    document.getElementById("popupBookingId");

const bookingIdContainer =
    document.getElementById("bookingIdContainer");

const popupButton =
    document.getElementById("popupButton");

const popupClose =
    document.getElementById("popupClose");


// ==========================================
// 11. SHOW POPUP
// ==========================================

function showPopup(
    type,
    title,
    message,
    bookingId = null,
    buttonText = "OK",
    callback = null
) {

    popupIcon.classList.remove(
        "success",
        "error",
        "warning"
    );

    popupIcon.classList.add(type);

    popupIcon.textContent =
        type === "success" ? "✓" : "!";

    popupTitle.textContent = title;

    popupMessage.textContent = message;


    if (bookingId) {

        bookingIdContainer.style.display = "block";

        popupBookingId.textContent = bookingId;

    } else {

        bookingIdContainer.style.display = "none";

        popupBookingId.textContent = "";

    }


    popupButton.textContent = buttonText;

    popupButton.onclick = function() {

        closePopup();

        if (callback) {
            callback();
        }

    };

    customModal.classList.add("show");

}


// ==========================================
// 12. CLOSE POPUP
// ==========================================

function closePopup() {

    customModal.classList.remove("show");

}


if (popupClose) {

    popupClose.addEventListener(
        "click",
        closePopup
    );

}


customModal.addEventListener("click", function(e) {

    if (e.target === customModal) {
        closePopup();
    }

});


// ==========================================
// 13. CUSTOMER AUTHENTICATION
// ==========================================

let currentUser = null;

let initialAuthResolved = false;

let resolveAuthReady;

const authReady = new Promise(resolve => {
    resolveAuthReady = resolve;
});


onAuthStateChanged(auth, (user) => {

    currentUser = user;


    // Resolve initial authentication check once.

    if (!initialAuthResolved) {

        initialAuthResolved = true;

        resolveAuthReady(user);

    }


    if (!user) {

        const currentPage =
            window.location.pathname.split("/").pop()
            + window.location.search;

        window.location.href =
            "login.html?redirect=" +
            encodeURIComponent(currentPage);

        return;

    }


    console.log("Customer logged in:", user.uid);


    // AUTO-FILL CUSTOMER NAME

    const nameInput =
        document.getElementById("customerName");

    if (
        nameInput &&
        user.displayName &&
        !nameInput.value
    ) {

        nameInput.value = user.displayName;

    }

});


// ==========================================
// 14. BOOKING FORM
// ==========================================

const bookingForm =
    document.getElementById("bookingForm");


if (bookingForm) {

    bookingForm.addEventListener("submit", async function(e) {

        e.preventDefault();


        // ==================================
        // WAIT FOR FIREBASE AUTHENTICATION
        // ==================================

        const authenticatedUser = await authReady;

        const user = auth.currentUser || authenticatedUser;


        if (!user) {

            showPopup(
                "warning",
                "Login Required",
                "Please login before making a booking.",
                null,
                "Login",
                function() {

                    window.location.href =
                        "login.html?redirect=" +
                        encodeURIComponent(
                            window.location.pathname +
                            window.location.search
                        );

                }
            );

            return;

        }


        // ==================================
        // VALIDATE CUSTOMER EMAIL
        // ==================================

        if (!user.email) {

            showPopup(
                "error",
                "Email Required",
                "Please log in using an email account before booking."
            );

            return;

        }


        // ==================================
        // PACKAGE VALIDATION
        // ==================================

        if (
            !packageNames[packageType] ||
            totalPrice === null ||
            !Number.isInteger(personNumber) ||
            !Number.isInteger(nights) ||
            nights < 1 ||
            nights > 30 ||
            !isValidDate(checkInDate) ||
            !isValidDate(checkOutDate)
        ) {

            showPopup(
                "error",
                "Invalid Package",
                "Your package details or travel dates are invalid. Please select your package again.",
                null,
                "Go Back",
                function() {
                    window.location.href = "totalpackage.html";
                }
            );

            return;

        }


        // ==================================
        // GET CUSTOMER DETAILS
        // ==================================

        const name =
            document.getElementById("customerName").value.trim();

        const mobile =
            document.getElementById("customerMobile").value.trim();

        const travelDate =
            document.getElementById("travelDate").value;

        const pickupTime =
            document.getElementById("pickupTime").value;

        const pickupLocation =
            document.getElementById("pickupLocation").value.trim();

        const specialRequest =
            document.getElementById("specialRequest").value.trim();


        // ==================================
        // NAME VALIDATION
        // ==================================

        if (
            name.length < 2 ||
            name.length > 100
        ) {

            showPopup(
                "warning",
                "Invalid Name",
                "Please enter a name between 2 and 100 characters."
            );

            return;

        }


        // ==================================
        // MOBILE VALIDATION
        // ==================================

        if (!/^[6-9][0-9]{9}$/.test(mobile)) {

            showPopup(
                "warning",
                "Invalid Mobile Number",
                "Please enter a valid 10-digit Indian mobile number."
            );

            return;

        }


        // ==================================
        // TRAVEL DATE VALIDATION
        // ==================================

        if (!isValidDate(travelDate)) {

            showPopup(
                "warning",
                "Invalid Travel Date",
                "Please select a valid travel date."
            );

            return;

        }


        // ==================================
        // PICKUP TIME VALIDATION
        // ==================================

        if (!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(pickupTime)) {

            showPopup(
                "warning",
                "Invalid Pickup Time",
                "Please select a valid pickup time."
            );

            return;

        }


        // ==================================
        // PICKUP LOCATION VALIDATION
        // ==================================

        if (
            pickupLocation.length < 2 ||
            pickupLocation.length > 250
        ) {

            showPopup(
                "warning",
                "Invalid Pickup Location",
                "Pickup location must contain 2 to 250 characters."
            );

            return;

        }


        // ==================================
        // SPECIAL REQUEST VALIDATION
        // ==================================

        if (specialRequest.length > 1000) {

            showPopup(
                "warning",
                "Special Request Too Long",
                "Please keep your special request within 1000 characters."
            );

            return;

        }


        // ==================================
        // DISABLE BUTTON
        // ==================================

        const button =
            bookingForm.querySelector(
                'button[type="submit"]'
            );

        if (!button) return;

        button.disabled = true;

        button.textContent = "Saving Booking...";


        // Declare outside try so catch can access it.
        let bookingData = null;


        try {

            // ==================================
            // CREATE FIRESTORE BOOKING DATA
            // ==================================

            bookingData = {

                userId: user.uid,

                customerEmail: user.email,

                bookingType: "package",

                package: packageType,

                packageName: packageNames[packageType],

                persons: personNumber,

                checkInDate: checkInDate,

                checkOutDate: checkOutDate,

                nights: nights,

                totalPrice: totalPrice,

                customerName: name,

                customerMobile: mobile,

                travelDate: travelDate,

                pickupTime: pickupTime,

                pickupLocation: pickupLocation,

                specialRequest: specialRequest,

                status: "pending",

                createdAt: serverTimestamp()

            };


            console.log(
                "Submitting package booking:",
                bookingData
            );


            // ==================================
            // SAVE TO FIRESTORE
            // ==================================

            const docRef = await addDoc(
                collection(db, "packageBookings"),
                bookingData
            );


            console.log(
                "Booking saved successfully:",
                docRef.id
            );


            // ==================================
            // SHOW SUCCESS POPUP
            // ==================================

            showPopup(

                "success",

                "Booking Request Submitted!",

                "Your booking request has been received. Our team will contact you to confirm your reservation.",

                docRef.id,

                "View Booking",

                function() {

                    window.location.href =
                        "booking-success.html?id=" +
                        encodeURIComponent(docRef.id);

                }

            );


        } catch (error) {

            console.error(
                "========== FIREBASE BOOKING ERROR =========="
            );

            console.error("Error code:", error.code);

            console.error("Error message:", error.message);

            console.error("Full error:", error);

            console.error("Current user:", {
                uid: user.uid,
                email: user.email
            });

            console.error("Submitted booking data:", bookingData);

            console.error(
                "============================================="
            );


            showPopup(
                "error",
                "Booking Failed",
                error.code === "permission-denied"
                    ? "Firebase rejected this booking. Check that your published Firestore price rules match the package price shown on this page."
                    : "Your booking could not be saved. Please try again or contact support."
            );


        } finally {

            button.disabled = false;

            button.textContent = "Confirm Booking";

        }

    });

}


</script>
<script src="header.js"></script>
<script src="language.js"></script>
</html>
