<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Confirmed | RamSethuYatra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f7fa;
        }

        .success-box {
            width: 90%;
            max-width: 550px;

            background: white;

            padding: 50px 30px;

            text-align: center;

            border-radius: 25px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.12);
        }

        .success-icon {
            font-size: 70px;
        }

        h1 {
            color: #073b67;
            margin: 15px 0;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .booking-id {
            margin: 25px 0;

            padding: 15px;

            background: #f5f7fa;

            border-radius: 10px;

            word-break: break-all;
        }

        .home-btn {
            display: inline-block;

            padding: 14px 30px;

            background: #073b67;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-weight: bold;
        }

        .home-btn:hover {
            background: #ff9d00;
            color: #111;
        }

    </style>

</head>


<body>


<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>
        Booking Submitted!
    </h1>

    <p>
        Thank you for choosing
        <strong>RamSethuYatra</strong>.
    </p>

    <p>
        Your package booking has been
        successfully submitted.
    </p>


    <div class="booking-id">

        <strong>Booking ID</strong>

        <br><br>

        <span id="bookingId">
            Loading...
        </span>

    </div>


    <p>
        Our team will contact you shortly
        to confirm your booking.
    </p>


    <a
        href="index.html"
        class="home-btn"
    >
        Back to Home
    </a>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    params.get("id");


document.getElementById("bookingId")
    .textContent =
    id || "Not available";

</script>


</body>

</html>
