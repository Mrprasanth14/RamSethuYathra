 <link rel="stylesheet" href="style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<section class="rooms-section">

<h2 class="section-title">🏨 Select Your Stay</h2>
<p class="section-subtitle">Comfortable rooms for your Ram Sethu Yatra</p>

<div class="room-container">

<!-- Room Card 1 -->
<div class="room-card">
    <img src="images/4011087171522283.jpg" alt="Standard Room">

    <div class="room-details">
        <h3>Standard Room</h3>
        <div class="room-features">
  <span>🛏️ AC Room</span>
  <span>📶 Free WiFi</span>
  <span>🚿 Hot Water</span>
</div>
        <!-- <p>₹2,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Standard Room">
            Select Room
        </label>
    </div>
</div>

<!-- Room Card 2 -->
<div class="room-card">
    <img src="images/_Elegant living room with a blend of modern and….jpg" alt="Family Room">

    <div class="room-details">
        <h3>Family Room</h3>
        <div class="room-features">
  <span>🛏️ AC Room</span>
  <span>📶 Free WiFi</span>
  <span>🚿 Hot Water</span>
</div>
        <!-- <p>₹4,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Family Room">
            Select Room
        </label>
    </div>
</div>

<!-- Room Card 3 -->
<div class="room-card">
    <img src="images/Modern blue theme bedroom with soft lighting and….jpg" alt="Premium Room">

    <div class="room-details">
        <h3>Premium Room</h3>
        <div class="room-features">
  <span>🛏️ AC Room</span>
  <span>📶 Free WiFi</span>
  <span>🚿 Hot Water</span>
</div>
        <!-- <p>₹6,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Premium Room">
            Select Room
        </label>
    </div>
</div>

</div>

<div class="booking-form">
<h3>Booking Details</h3>

<label>How Many Persons?</label>
<select id="roomPersons" required>
    <option value="" selected disabled>Select Persons</option>
    <option value="1">1 Person</option>
    <option value="2">2 Persons</option>
    <option value="3">3 Persons</option>
    <option value="4">4 Persons</option>
    <option value="5">5 Persons</option>
    <option value="6">6 Persons</option>
</select>

<label>Check In</label>
<input type="date" id="checkin">

<label>Check Out</label>
<input type="date" id="checkout">

<label>Mobile Number</label>
<input type="tel" id="roomMobile" placeholder="Enter Mobile Number">

<label>Email</label>
<input type="email" id="roomEmail" placeholder="Enter Email">

<label>Special Request</label>
<textarea id="request" placeholder="Any special requirements"></textarea>

<button type="button" onclick="sendRoomWhatsApp()">Continue Booking</button>

</div>
</section>
<script src="script.js"></script>
