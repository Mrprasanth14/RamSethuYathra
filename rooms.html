 <link rel="stylesheet" href="style.css">
<section class="rooms-section">

<h2>Choose Your Room</h2>

<div class="room-container">

<!-- Room Card 1 -->
<div class="room-card">
    <img src="images/room1.jpg" alt="Standard Room">

    <div class="room-details">
        <h3>Standard Room</h3>
        <p>11 - 11</p>
        <!-- <p>₹2,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Standard Room">
            Select Room
        </label>
    </div>
</div>

<!-- Room Card 2 -->
<div class="room-card">
    <img src="images/room2.jpg" alt="Family Room">

    <div class="room-details">
        <h3>Family Room</h3>
        <p>11 - 11</p>
        <!-- <p>₹4,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Family Room">
            Select Room
        </label>
    </div>
</div>

<!-- Room Card 3 -->
<div class="room-card">
    <img src="images/room3.jpg" alt="Premium Room">

    <div class="room-details">
        <h3>Premium Room</h3>
        <p>11 - 11</p>
        <!-- <p>₹6,500 / Night</p> -->

        <label>
            <input type="radio" name="room" value="Premium Room">
            Select Room
        </label>
    </div>
</div>

</div>

<div class="booking-form">
<h3>Booking Details</h3>

<label>How Many Persons?</label>
<select>
    <option>1 Person</option>
    <option>2 Persons</option>
    <option>3 Persons</option>
    <option>4 Persons</option>
    <option>5 Persons</option>
    <option>6 Persons</option>
</select>

<label>Check In</label>
<input type="date">

<label>Check Out</label>
<input type="date">

<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Special Request</label>
<textarea placeholder="Any special requirements"></textarea>

<button class="book-btn">Book Now</button>

</div>

</section>
