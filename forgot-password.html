<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | RamSethuYatra</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #fffaf4;
        padding: 20px;
    }

    .forgot-container {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 40px 35px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        color: #003049;
        margin-bottom: 25px;
    }

    .icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    h1 {
        color: #003049;
        margin-bottom: 10px;
    }

    .description {
        color: #666;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    label {
        display: block;
        text-align: left;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        margin-bottom: 15px;
    }

    input:focus {
        border-color: #f77f00;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #f77f00;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #d96800;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        margin-top: 18px;
        line-height: 1.5;
        font-size: 14px;
    }

    .success {
        color: green;
    }

    .error {
        color: #d00000;
    }

    .back-login {
        display: inline-block;
        margin-top: 22px;
        color: #003049;
        text-decoration: none;
        font-weight: bold;
    }

    .back-login:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {

        .forgot-container {
            padding: 30px 22px;
        }

        h1 {
            font-size: 25px;
        }

    }

</style>

</head>

<body>
<div class="forgot-container">


    <div class="logo">
        🛕 RamSethuYatra
    </div>


    <div class="icon">
        🔐
    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="description">
        Enter the email address you used to create your
        RamSethuYatra account. We will send you a secure
        password reset link.
    </p>


    <form id="forgotForm">

        <label for="email">
            Email Address
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
        >


        <button
            type="submit"
            id="resetButton"
        >
            Send Reset Link
        </button>

    </form>


    <p id="message"></p>


    <a
        href="login.html"
        class="back-login"
    >
        ← Back to Login
    </a>

</div>



<script type="module">

    import {
        auth
    } from "./firebase.js";


    import {
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";


    const forgotForm =
        document.getElementById("forgotForm");


    const emailInput =
        document.getElementById("email");


    const resetButton =
        document.getElementById("resetButton");


    const message =
        document.getElementById("message");


    forgotForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                message.textContent =
                    "Please enter your email address.";

                message.className =
                    "error";

                return;

            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Sending...";


            message.textContent = "";

            message.className = "";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                message.textContent =
                    "Password reset email sent. " +
                    "Please check your inbox and spam folder.";


                message.className =
                    "success";


                emailInput.value = "";


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                message.textContent =
                    "Unable to send the reset email. " +
                    "Please check the email address and try again.";


                message.className =
                    "error";

            }


            resetButton.disabled = false;

            resetButton.textContent =
                "Send Reset Link";

        }
    );

</script>

</body>

</html>
